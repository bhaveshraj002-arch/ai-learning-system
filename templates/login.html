<!DOCTYPE html>
<html>
<head>

    <title>Login</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">

</head>

<body class="centered-page">

<div class="orb"></div>

<div class="card">

    <div class="card-header">

        <h1 class="card-title">
            Login
        </h1>

        <p class="card-subtitle">
            Enter your credentials to continue.
        </p>

    </div>

    <form method="POST" class="form">

        <div class="field">

            <label>Email</label>

            <input
            type="email"
            name="email"
            placeholder="Enter email"
            required>

        </div>

        <div class="field">

            <label>Password</label>

            <input
            type="password"
            name="password"
            placeholder="Enter password"
            required>

        </div>

        <button
        type="submit"
        class="btn btn-primary btn-full">

            Login

        </button>

    </form>

</div>

</body>
</html>
