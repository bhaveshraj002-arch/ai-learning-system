<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
</head>
<body>

<h1>Welcome {{ name }}</h1>

<h2>Your Interest: {{ interest }}</h2>

<h2>Recommended YouTube Videos</h2>

{% for video in videos %}

<div style="margin-bottom:20px;">

    <h3>{{ video.title }}</h3>

    <a href="{{ video.link }}" target="_blank">
        Watch Video
    </a>

</div>

{% endfor %}

<a href="/quiz">Start Quiz</a>

<br><br>

<a href="/logout">Logout</a>

</body>
</html>
