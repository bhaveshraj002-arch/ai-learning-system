<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body class="page">

<div class="orb"></div>
<div class="orb orb-top-right"></div>

<div class="page-content">

    <div class="page-header">

        <div>

            <p class="page-eyebrow">
                Quiz Section
            </p>

            <h1 class="page-title">
                Attempt Quiz
            </h1>

        </div>

    </div>

    <form action="/submit_quiz" method="POST">

        <div class="quiz-list">

            {% for q in questions %}

            <div class="quiz-card">

                <div class="quiz-number">
                    {{ loop.index }}
                </div>

                <div class="quiz-body">

                    <div class="quiz-question">
                        {{ q.question }}
                    </div>

                    {% for option in q.options %}

                    <label class="quiz-answer-wrap">

                        <input
                            type="radio"
                            name="q{{ loop.parent.index0 }}"
                            value="{{ option }}"
                            required
                        >

                        <span class="quiz-answer">
                            {{ option }}
                        </span>

                    </label>

                    {% endfor %}

                </div>

            </div>

            {% endfor %}

        </div>

        <br><br>

        <button type="submit" class="btn btn-primary btn-full">
            Submit Quiz
        </button>

    </form>

</div>

</body>
</html>
